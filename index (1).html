function normLang(){
 const ix=LG==='fr'?1:0,cm=new Map(),om=new Map();let ch=false;
 LGX.forEach(r=>{cm.set(r[0],r[ix]);cm.set(r[1],r[ix])});
 COLS.forEach(c=>{om.set(c[0],c[ix]);om.set(c[1],c[ix])});
 const tr=(m,v)=>m.has(v)?m.get(v):v,set=(o,k,m)=>{if(o&&typeof o[k]==='string'&&o[k]){const n=tr(m,o[k]);if(n!==o[k]){o[k]=n;ch=true}}};
 if(Array.isArray(S.set.cats))S.set.cats.forEach(c=>{set(c,'n',cm);(c.g||[]).forEach(g=>set(g,'n',cm))});
 const ren={};
 S.prods.forEach(p=>{set(p,'cat',cm);const old=p.color,n=tr(om,old);
  if(old&&n!==old){p.color=n;ch=true;if(p.base!==undefined&&p.base!==''){const nn=vname(p.base,p.color,p.size);if(nn!==p.n){ren[p.id]=nn;p.n=nn}}}});
 if(Object.keys(ren).length){S.log.forEach(l=>{if(ren[l.pid])l.n=ren[l.pid]});(S.counts||[]).forEach(c=>(c.items||[]).forEach(i=>{if(ren[i.pid])i.n=ren[i.pid]}))}
 FS.c=tr(cm,FS.c);CC=tr(cm,CC);FCAT=tr(cm,FCAT);
 const rk=(o,f)=>{const r={};Object.keys(o).forEach(k=>r[f(k)]=o[k]);return r};
 FCS=rk(FCS,k=>tr(om,k));FCI=rk(FCI,k=>tr(om,k));FQ=rk(FQ,k=>{const i=k.lastIndexOf('|');return i<0?k:tr(om,k.slice(0,i))+k.slice(i)});
 return ch}

 const val=o.n!==undefined?`<b data-n="${o.n}"${o.m?' data-m="1"':''}${o.s?` data-s="${o.s}"`:''}${st}>0</b>`:`<b${st}>${o.t}</b>`;

 const d=v.map((y,i)=>(i?'L':'M')+(i*(w/(n-1))).toFixed(1)+' '+(h-8-(y-mn)/rg*(h-16)).toFixed(1)).join(' ');
 return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block"><path class="sp-area" d="${d} L${w} ${h} L0 ${h}Z" fill="${col}" opacity=".13"/><path class="sp-line" d="${d}" pathLength="1" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`}

  if(q){if(ch==='"'){if(tx[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;
  else if(ch===d){r.push(c);c=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&tx[i+1]==='\n')i++;r.push(c);c='';M.push(r);r=[]}
  else c+=ch}

function impCat(v){if(!v)return '';const k=nz(v),hit=CATS().find(c=>nz(c.n)===k);if(hit)return hit.n;

function impBuild(M){
 let hi=-1,col={};
 for(let i=0;i<Math.min(M.length,15)&&hi<0;i++){const cells=(M[i]||[]).map(nz),c={};
  Object.keys(IMPH).forEach(k=>{const j=cells.findIndex(x=>x&&IMPH[k].some(a=>nz(a)===x));if(j>=0)c[k]=j});
  if(c.n!==undefined){hi=i;col=c}}
 if(hi<0)return {err:'hdr'};
 const get=(r,k)=>col[k]===undefined||r[col[k]]==null?'':String(r[col[k]]).trim(),seen=new Set(),rows=[],AC=allCols();
 for(let i=hi+1;i<M.length;i++){const r=M[i]||[];
  if(!r.some(x=>String(x==null?'':x).trim()!==''))continue;
  if(rows.length>=3000)return {err:'big'};
  const o={r:i+1,base:get(r,'n').slice(0,80),st:'new',e:''},cr=get(r,'o'),cl=cr?AC.find(x=>[x.a,x.b,x.n].some(v=>nz(v)===nz(cr))):null;

  let q=0;const qr=col.q===undefined?'':r[col.q];
  if(typeof qr==='number')q=qr;else{const s=nz(qr).replace(/\s/g,'').replace(',','.');q=s===''?0:Number(s)}
  o.q=q;o.qr=String(qr==null?'':qr).slice(0,20);o.n=vname(o.base,o.color,o.size);
  if(!o.base){o.st='err';o.e='name'}
  else if(!Number.isFinite(q)||q<0||!Number.isInteger(q)){o.st='err';o.e='qty'}
  else{const key=o.n.toLowerCase();
   if(seen.has(key)){o.st='err';o.e='dupfile'}
   else{seen.add(key);const ex=S.prods.find(p=>p.n.toLowerCase()===key);if(ex){o.st='dup';o.pid=ex.id}}}
  rows.push(o)}

 if(/^\d+$/.test(dm)){const m=String(ref).match(/(\d+)\D*(\d{4})\s*$/),seq=m?m[1]:((String(ref).match(/\d+/)||[])[0]);
  if(seq&&parseInt(seq,10)===parseInt(dm,10))return true;return dm.length>=5&&rn.includes(dm)}
